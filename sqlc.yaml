version: "2"
sql:
  - engine: "postgresql"
    schema: "sql/schema"
    queries: "sql/queries"
    gen:
      go:
        package: "generated"
        out: "internal/db/generated"
        sql_package: "pgx/v5"
        # Fitur ini sudah menangani nullable secara otomatis (menjadi pointer)
        # Jadi kita tidak perlu mendefinisikan "nullable: true" satu per satu
        emit_pointers_for_null_types: true
        emit_json_tags: true
        overrides:
          # --- UUID ---
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"

          # --- WAKTU / TIMESTAMPS ---
          # (Mencakup penulisan spesifik maupun alias)
          - db_type: "timestamp with time zone"
            go_type: "time.Time"
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamp without time zone"
            go_type: "time.Time"
          - db_type: "timestamp"
            go_type: "time.Time"
          - db_type: "date"
            go_type: "time.Time"

          # --- ANGKA / NUMERIC ---
          - db_type: "pg_catalog.numeric"
            go_type: "float64"
          - db_type: "numeric"
            go_type: "float64"
          - db_type: "decimal"
            go_type: "float64"

          # --- JSON (Edge Case Tambahan) ---
          # Sangat umum digunakan di Postgres. Menggunakan json.RawMessage
          # lebih baik daripada string agar validasi JSON terjaga.
          - db_type: "jsonb"
            go_type: "encoding/json.RawMessage"
          - db_type: "json"
            go_type: "encoding/json.RawMessage"